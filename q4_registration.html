<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q4 - Student Registration Form</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f7; }
  form { max-width: 480px; margin: 40px auto; background: #fff; padding: 25px 30px;
         border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  h2 { text-align: center; color: #2c3e50; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input[type="text"], input[type="password"], input[type="email"],
  select, textarea { width: 100%; padding: 8px; margin-top: 5px;
    border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  .radio-group label, .checkbox-group label { font-weight: normal; display: inline-block; margin-right: 15px;}
  .buttons { margin-top: 20px; text-align: center; }
  button { padding: 10px 25px; margin: 0 8px; border: none; border-radius: 5px; cursor: pointer; }
  .submit-btn { background: #27ae60; color: #fff; }
  .reset-btn { background: #e74c3c; color: #fff; }
</style>
</head>
<body>

<form action="#" method="post">
  <h2>Student Registration Form</h2>

  <label for="fullname">Full Name</label>
  <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" placeholder="Choose a password" required>

  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" placeholder="you@example.com" required>

  <label>Gender</label>
  <div class="radio-group">
    <label><input type="radio" name="gender" value="male" checked> Male</label>
    <label><input type="radio" name="gender" value="female"> Female</label>
    <label><input type="radio" name="gender" value="other"> Other</label>
  </div>

  <label>Hobbies</label>
  <div class="checkbox-group">
    <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
    <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
    <label><input type="checkbox" name="hobbies" value="music"> Music</label>
  </div>

  <label for="department">Department</label>
  <select id="department" name="department">
    <option value="cs">Computer Science</option>
    <option value="it">Information Technology</option>
    <option value="ece">Electronics</option>
    <option value="mech">Mechanical</option>
  </select>

  <label for="address">Address</label>
  <textarea id="address" name="address" rows="4" placeholder="Enter your postal address"></textarea>

  <div class="buttons">
    <button type="submit" class="submit-btn">Submit</button>
    <button type="reset" class="reset-btn">Reset</button>
  </div>
</form>

</body>
</html>
