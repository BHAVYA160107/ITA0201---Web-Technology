<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q8 - Images, Hyperlinks and Iframes</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
  img { border-radius: 6px; margin: 10px 0; }
  iframe { border: 2px solid #34495e; border-radius: 6px; margin-top: 15px; }
  a { color: #2980b9; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Images, Hyperlinks and Iframes Demo</h1>

<h2>1. Image Tag</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Programming_language_logos.png/320px-Programming_language_logos.png"
     alt="Illustration of programming language logos"
     width="320" height="200" />

<h2>2. Hyperlinks (Anchor Tag)</h2>
<ul>
  <li><a href="https://www.w3.org/" target="_blank">Visit the W3C website</a></li>
  <li><a href="https://developer.mozilla.org/" target="_blank">Visit MDN Web Docs</a></li>
  <li><a href="#section-iframe">Jump to the Iframe section on this page</a></li>
</ul>

<h2 id="section-iframe">3. Iframe (Embedding an External Webpage)</h2>
<iframe src="https://www.w3.org/"
        title="W3C website embedded in an iframe"
        width="600" height="350">
  Your browser does not support iframes.
</iframe>

</body>
</html>
